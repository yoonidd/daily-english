name: Daily English

on:
  schedule:
    # GitHub 스케줄은 정시(:00)에 몰려 지연·유실이 잦습니다.
    # 그래서 애매한 분으로 잡고, 놓쳤을 때를 대비해 예비 실행을 둡니다.
    - cron: '55 22 * * *'   # 07:55 KST — 본 발송
    - cron: '40 23 * * *'   # 08:40 KST — 예비 1
    - cron: '40 1 * * *'    # 10:40 KST — 예비 2
  workflow_dispatch:

permissions:
  contents: write           # state/last_sent.txt 커밋용

concurrency:
  group: daily-english      # 예비 실행이 겹쳐 돌지 않도록
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Send today's lesson
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # 수동 실행(Run workflow)일 때는 중복 방지를 무시하고 무조건 보냄
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python send.py

      - name: Record that today was sent
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "sent $(TZ=Asia/Seoul date +%F)"
            git push
          else
            echo "nothing to record"
          fi
