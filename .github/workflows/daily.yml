name: Daily English

on:
  schedule:
    - cron: '55 22 * * *'
    - cron: '40 23 * * *'
    - cron: '40 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-english
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send today's lesson
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python send.py
      - name: Record that today was sent
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "sent $(TZ=Asia/Seoul date +%F)"
            git push
          else
            echo "nothing to record"
          fi
